name: Sync FADEWELL Storefront

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fadewell-storefront-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check cloudscraper requests
      - name: Refresh public pairs from Vinted
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VINTED_USER_ID: '271911480'
          STOREFRONT_ARCHIVE_SOLD_SINCE: '2026-08-01'
        run: python cloud/storefront_live_sync.py
      - name: Trigger public storefront build
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FADEWELL_SITE_DISPATCH_TOKEN }}
          SITE_REPO: PanDory1992/fadewell-site
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::FADEWELL_SITE_DISPATCH_TOKEN is not configured; the hourly storefront fallback remains active."
            exit 0
          fi
          printf '{"event_type":"storefront-updated","client_payload":{"source_run_id":"%s"}}' "$GITHUB_RUN_ID" \
            | gh api --method POST "repos/$SITE_REPO/dispatches" --input - \
            || echo "::warning::Storefront dispatch failed; the hourly storefront fallback remains active."
