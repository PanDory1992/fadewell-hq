name: Deploy HQ Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pricing cockpit
        run: node web/pricing.test.mjs && node web/pricing-candidates.test.mjs && node web/experiment-cockpit.test.mjs && node scripts/test_experiment_engine.mjs
      - name: Check sourcing capacity gate
        run: node web/sourcing.test.mjs
      - name: Reject malformed UTF-8 and mojibake
        run: node scripts/check_mojibake.mjs web
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
