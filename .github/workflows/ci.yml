name: Test HQ

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: pip install --disable-pip-version-check cloudscraper requests
      - name: Run Python tests
        run: python -m unittest discover -s cloud -p 'test_*.py'
      - name: Check HQ text encoding
        run: node scripts/check_mojibake.mjs .
      - name: Check sale exception reconciliation
        run: node scripts/test_sale_exception_reconciliation.mjs
      - name: Check Gmail intake hardening
        run: |
          node scripts/test_confirmation_needed_gmail_parser.mjs
          node scripts/test_gmail_sync_cursor.mjs
          node scripts/test_gmail_oauth_callback.mjs
          python -m unittest cloud.test_gmail_sync_watchdog
      - name: Check relist pending state machine
        run: node scripts/test_relist_contract.mjs
      - name: Check operations state visibility
        run: node web/system.test.mjs
      - name: Check experiment engine contract
        run: node scripts/test_experiment_engine.mjs
      - name: Check sourcing capacity gate and UTF-8 repair
        run: node web/sourcing.test.mjs
