<!doctype html>
<html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akcje · FADEWELL HQ</title><link rel="stylesheet" href="hq.css">
<main>
  <header class="top"><div><div class="eyebrow">FADEWELL HQ</div><h1>Akcje</h1><p class="muted">Każda decyzja tworzy audytowalne zdarzenie — nic nie nadpisuje historii.</p></div><span class="badge">Canonical DEN</span></header>
  <nav id="nav"></nav><div class="row-actions"><button id="login">Zaloguj przez GitHub</button><button id="logout" hidden class="secondary">Wyloguj</button><span id="status" class="muted small"></span></div>
  <section id="app" hidden class="split"><article class="card stack">
    <label>Rodzaj akcji<select id="kind"><option value="SALE">Sprzedaż</option><option value="LISTED">Wystawienie</option><option value="TITLE_CHANGE">Zmień tytuł itemu</option><option value="ADJUSTMENT">Korekta / notatka księgowa</option><option value="PURCHASE">Nowy zakup</option><option value="VOID">Anuluj zakup (Void)</option><option value="UNVOID">Przywróć anulowany zakup (Un-void)</option></select></label>
    <label id="itemWrap">DEN<select id="item"></select></label>
    <div id="purchase" class="hidden"><label>Nazwa itemu<input id="purchaseName" placeholder="np. Levi's 501 W32 L32"></label><div class="two-col"><label>Koszt zakupu<input id="cost" type="number" min="0" step="0.01"></label><label>Dostawa<input id="delivery" type="number" min="0" step="0.01" value="0"></label></div><label>Źródło<input id="source" placeholder="np. Vinted"></label></div>
    <div id="listing" class="hidden"><label>Vinted Item ID<input id="vinted"></label><label>URL oferty<input id="url" placeholder="https://www.vinted.pl/items/…"></label><label>Tytuł z Vinted<input id="title"></label></div>
    <div id="titleChange" class="hidden"><label>Nowy tytuł w HQ<input id="newTitle" maxlength="240" placeholder="np. Levi's 501 W32 L32 — 1998"></label><p class="muted small">Zmienia tytuł wyświetlany w HQ, nie tytuł oferty na Vinted. Obserwowany tytuł Vinted pozostaje zachowany jako źródło.</p></div>
    <label id="dateWrap">Data<input id="date" type="date"></label><label id="amountWrap">Kwota PLN<input id="amount" type="number" min="0" step="0.01"></label><label>Notatka / dowód<textarea id="note" placeholder="Dla korekty wyjaśnij, co i dlaczego."></textarea></label><div class="row-actions"><button id="save">Zapisz akcję</button><span id="result" class="muted"></span></div>
  </article><aside class="card"><h2>Kontrola przed zapisem</h2><div id="preview" class="muted">Wybierz akcję.</div></aside></section>
</main>
<script type="module">
import{shell,data,$,safe,money,sb,itemTitle,toast}from'./hq.js?v=20260726-cache-2h';
let items=[];const selected=()=>items.find(x=>x.item_id===item.value);
function render(){const k=kind.value,p=k==='PURCHASE',l=k==='LISTED',s=k==='SALE',t=k==='TITLE_CHANGE',v=k==='VOID',u=k==='UNVOID',x=selected();purchase.classList.toggle('hidden',!p);listing.classList.toggle('hidden',!l);titleChange.classList.toggle('hidden',!t);itemWrap.classList.toggle('hidden',p);amountWrap.classList.toggle('hidden',k==='ADJUSTMENT'||t||p||v||u);dateWrap.classList.toggle('hidden',p||v||u);amount.placeholder=s?'Cena sprzedaży':l?'Cena listy':'Kwota';if(t&&x&&!newTitle.value.trim())newTitle.value=itemTitle(x);preview.innerHTML=v?`<b>${safe(x?.item_id||'Wybierz DEN')} · ANULOWANIE ZAKUPU (Void)</b><p>Kapitał przedmiotu zostanie ustawiony na 0 PLN, a status na VOIDED. W logu powstanie trwały i w 100% odwracalny wpis z pełną kopią zapasową.</p>`:u?`<b>${safe(x?.item_id||'Wybierz DEN')} · PRZYWRÓCENIE ZAKUPU (Un-void)</b><p>Przywróci anulowany zakup z powrotem do backlogu i odzyska oryginalny kapitał.</p>`:s?`<b>${safe(x?.item_id||'Wybierz DEN')} · ${safe(itemTitle(x||{}))}</b><p>Sprzedaż zapisze cenę i wynik z istniejącego kapitału.</p>`:t?`<b>${safe(x?.item_id||'Wybierz DEN')} · zmiana tytułu</b><p>Powstanie trwały wpis z poprzednim i nowym tytułem. Oferta Vinted nie zostanie zmieniona.</p>`:k==='ADJUSTMENT'?'<b>Korekta</b><p>Powstanie nowe zdarzenie z Twoim uzasadnieniem; historia pozostaje nienaruszona.</p>':l?'<b>Wystawienie</b><p>Połączy DEN z ofertą Vinted.</p>':'<b>Nowy zakup</b><p>HQ utworzy nowy DEN.</p>'}
async function saveAction(){const k=kind.value,x=selected(),amount=amountWrap.classList.contains('hidden')?null:amountWrap.querySelector('input').value;if(k!=='PURCHASE'&&!x){result.textContent='Wybierz DEN.';return}if(k==='ADJUSTMENT'&&!note.value.trim()){result.textContent='Korekta wymaga uzasadnienia.';return}if(k==='TITLE_CHANGE'&&!newTitle.value.trim()){result.textContent='Podaj nowy tytuł.';return}if(k==='SALE'&&(!amount||Number(amount)<0)){result.textContent='Podaj prawidłową cenę.';return}if(k==='SALE'&&!confirm(`${x.item_id} · ${itemTitle(x)} · ${money(amount)} — potwierdź sprzedaż.`))return;if(k==='LISTED'&&!vinted.value.trim()){result.textContent='Podaj Vinted Item ID.';return}
    if(k==='VOID'){
      if(!note.value.trim()){result.textContent='Anulowanie wymaga uzasadnienia w polu notatki.';return;}
      if(!confirm(`${x.item_id} · ${itemTitle(x)} — Czy na pewno anulować ten zakup? (Kapitał zostanie ustawiony na 0 PLN, odwracalne).`))return;
      save.disabled=true;
      try{
        const backupNote=`ANULOWANIE ZAKUPU (Void): ${note.value.trim()} [Kopia bezpieczeństwa: status=${x.ledger_status}, cost=${x.purchase_cost||x.total_capital||0}, total_capital=${x.total_capital||0}, manual_title=${x.manual_title||''}]`;
        const{error:evErr}=await sb.from('hq_ledger_events').insert({item_id:x.item_id,event_type:'ADJUSTMENT',occurred_on:new Date().toISOString().slice(0,10),amount:0,currency:'PLN',detail:backupNote,source:'MANUAL',external_key:'void-'+x.item_id+'-'+Date.now()});
        if(evErr)throw evErr;
        const{error:itemErr}=await sb.from('hq_ledger_items').update({ledger_status:'VOIDED',purchase_cost:0,delivery_cost:0,total_capital:0,manual_title:(x.manual_title||x.name||'').includes('[VOIDED]')?x.manual_title:'[VOIDED] '+(x.manual_title||x.name||''),updated_at:new Date().toISOString()}).eq('item_id',x.item_id);
        if(itemErr)throw itemErr;
        await sb.from('hq_external_events').update({state:'MANUAL_RESOLVED'}).eq('matched_item_id',x.item_id);
        result.className='ok';result.textContent='Zakup anulowany (kapitał = 0 PLN).';toast('Zakup anulowany (Void)');setTimeout(()=>location.href='ledger.html?filter=VOIDED',600);return;
      }catch(e){result.className='bad';result.textContent=e.message||e;return;}finally{save.disabled=false;}
    }
    if(k==='UNVOID'){
      if(!confirm(`${x.item_id} — Przywrócić ten zakup z powrotem do backlogu?`))return;
      save.disabled=true;
      try{
        const{data:evs}=await sb.from('hq_ledger_events').select('*').eq('item_id',x.item_id).eq('event_type','ADJUSTMENT').order('id',{ascending:false});
        let restoredCost=28.85;
        if(evs&&evs.length){const m=evs[0].detail?.match(/cost=([0-9.]+)/);if(m)restoredCost=Number(m[1]);}
        await sb.from('hq_ledger_events').insert({item_id:x.item_id,event_type:'ADJUSTMENT',occurred_on:new Date().toISOString().slice(0,10),amount:restoredCost,currency:'PLN',detail:`PRZYWRÓCENIE ZAKUPU (Un-void): ${note.value.trim()||'Przywrócono do backlogu'}`,source:'MANUAL',external_key:'unvoid-'+x.item_id+'-'+Date.now()});
        await sb.from('hq_ledger_items').update({ledger_status:'UNLISTED-BACKLOG',purchase_cost:restoredCost,delivery_cost:0,total_capital:restoredCost,manual_title:(x.manual_title||'').replace('[VOIDED] ',''),updated_at:new Date().toISOString()}).eq('item_id',x.item_id);
        await sb.from('hq_external_events').update({state:'AUTO_APPLIED'}).eq('matched_item_id',x.item_id);
        result.className='ok';result.textContent='Zakup przywrócony do backlogu.';toast('Zakup przywrócony');setTimeout(()=>location.href=`ledger.html?item=${encodeURIComponent(x.item_id)}`,600);return;
      }catch(e){result.className='bad';result.textContent=e.message||e;return;}finally{save.disabled=false;}
    }save.disabled=true;try{let payload;if(k==='PURCHASE'){if(!purchaseName.value.trim()||cost.value==='')throw new Error('Zakup wymaga nazwy i kosztu.');payload={action_type:'PURCHASE',item_id:'',name:purchaseName.value.trim(),sourcing_type:source.value.trim()||null,purchase_cost:cost.value,delivery_cost:delivery.value||0,total_capital:(Number(cost.value)+Number(delivery.value||0)).toFixed(2),occurred_on:date.value||null,note:note.value.trim()||null,external_key:crypto.randomUUID()}}else{payload={action_type:k,item_id:x.item_id,occurred_on:date.value||null,amount:amount||null,note:note.value.trim()||null,external_key:crypto.randomUUID()};if(k==='LISTED')Object.assign(payload,{vinted_item_id:vinted.value.trim(),listing_url:url.value.trim()||null,live_title:title.value.trim()||null});if(k==='TITLE_CHANGE')payload.title=newTitle.value.trim()}const{error}=await sb.rpc('apply_hq_ledger_action_owner',{p:payload});if(error)throw error;result.className='ok';result.textContent='Zapisano.';toast('Akcja zapisana');setTimeout(()=>location.href=`ledger.html?item=${encodeURIComponent(x?.item_id||'')}`,500)}catch(e){result.className='bad';result.textContent=e.message||e}finally{save.disabled=false}}
if(await shell('actions.html')){app.hidden=false;try{items=(await data()).items;item.innerHTML='<option value="">Wybierz DEN</option>'+items.map(x=>`<option value="${safe(x.item_id)}">${safe(x.item_id)} · ${safe(itemTitle(x))}</option>`).join('');const params=new URLSearchParams(location.search);item.value=params.get('item')||'';date.value=new Date().toISOString().slice(0,10);if(['SALE','LISTED','TITLE_CHANGE','ADJUSTMENT','PURCHASE'].includes(params.get('kind')))kind.value=params.get('kind');kind.onchange=render;item.onchange=()=>{newTitle.value='';render()};save.onclick=saveAction;render()}catch(e){app.innerHTML=`<div class="notice">Nie udało się uruchomić Akcji: ${safe(e.message||e)}</div>`}}
</script></html>
